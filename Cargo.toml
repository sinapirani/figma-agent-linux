[package]
name = "figma-agent"
version = "126.10.13"
edition = "2021"
description = "Linux implementation of the Figma Agent (local fonts for figma.com)"
license = "MIT"

[dependencies]
form_urlencoded = "1.2.2"
miniz_oxide = "0.8.0"
serde_json = "1.0.149"
tiny_http = "0.12.0"
ttf-parser = "0.25.1"
walkdir = "2.5.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
